<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Run for Earn Admin</title>
<style>body{font:15px Arial,sans-serif;margin:0;color:#333;background:#fff}header{display:flex;gap:6px;padding:8px;border-bottom:2px solid #555}button{border:2px solid #555;background:#fff;padding:9px 12px;font-weight:700;color:#333}button.on{background:#555;color:#fff}main{padding:10px;max-width:760px;margin:auto}.card{border:2px solid #555;padding:10px;margin:10px 0;word-break:break-all}input{padding:9px;border:2px solid #555;margin:4px 0;width:100%;box-sizing:border-box}.row{display:flex;gap:6px}small{color:#777}</style></head><body>
<header><button data-t="wd" onclick="tab('wd')">WITHDRAWALS</button><button data-t="lb" onclick="tab('lb')">LEADERBOARD</button><button data-t="set" onclick="tab('set')">SETTINGS</button></header><main id="v"></main>
<script>
let KEY=sessionStorage.getItem('k')||'',st='pending';
const $=id=>document.getElementById(id),V=$('v'),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
async function A(action,d){const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':KEY},body:JSON.stringify(Object.assign({action},d))});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401){sessionStorage.removeItem('k');KEY='';}throw new Error(j.error||r.status)}return j}
function cp(t){navigator.clipboard&&navigator.clipboard.writeText(t)}
function login(){KEY=$('key').value;sessionStorage.setItem('k',KEY);tab('wd')}
function tab(t){document.querySelectorAll('header button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(!KEY){V.innerHTML='<h3>Admin key</h3><input id="key" type="password"><button onclick="login()">LOGIN</button>';return}({wd,lb,set})[t]().catch(e=>{V.innerHTML='<div class=card>'+esc(e.message)+'</div>'+(KEY?'':'<button onclick="tab(\'wd\')">TRY AGAIN</button>')})}
async function wd(){const {list}=await A('withdrawals',{status:st});
 V.innerHTML='<div class=row>'+['pending','paid','rejected'].map(s=>'<button class="'+(s===st?'on':'')+'" onclick="st=\''+s+'\';wd()">'+s.toUpperCase()+'</button>').join('')+'</div>'+(list.length?list.map(w=>'<div class=card><b style="font-size:22px">₹'+w.amount+'</b> <small>'+new Date(w.t).toLocaleString()+'</small><br>'+esc(w.holder)+'<br>A/C: <b>'+esc(w.acc)+'</b> <button onclick="cp(\''+esc(w.acc)+'\')">COPY</button><br>IFSC: <b>'+esc(w.ifsc)+'</b> <button onclick="cp(\''+esc(w.ifsc)+'\')">COPY</button><br><small>Telegram: '+esc(w.tgName)+' · id '+esc(w.uid)+'</small>'+(w.status==='pending'?'<input id="r'+w.id+'" placeholder="UTR / payment reference"><div class=row><button onclick="act(\'pay\',\''+w.id+'\')">MARK PAID</button><button onclick="act(\'reject\',\''+w.id+'\')">REJECT</button></div>':'<br><small>'+esc(w.status)+' '+esc(w.ref||w.reason||'')+'</small>')+'</div>').join(''):'<p>No '+st+' requests</p>')}
async function act(a,id){const v=$('r'+id).value;if(a==='reject'&&!confirm('Reject and refund to wallet?'))return;if(a==='pay'&&!confirm('Confirm: you have already sent this money to the bank account?'))return;try{await A(a,{id,ref:v,reason:v});wd()}catch(e){alert(e.message)}}
async function lb(d){const r=await A('board',{date:d||($('dt')&&$('dt').value)});
 V.innerHTML='<div class=row><input type=date id=dt value="'+r.date+'"><button onclick="lb($(\'dt\').value)">LOAD</button></div><h3>'+r.date+' — '+(r.settled?'PRIZES PAID TO WALLETS':'NOT PAID YET')+'</h3>'+r.top.map((t,i)=>'<div class=card>#'+(i+1)+' '+esc(t.name)+' · <b>'+t.score+'</b>'+(i<5?' → ₹'+(r.cfg.prizes[i]||0):'')+'<br><small>id '+esc(t.uid)+'</small></div>').join('')+(r.settled?'':'<button onclick="pay(\''+r.date+'\')">PAY PRIZES TO WALLETS</button>')+'<p><small>Runs automatically every day at 12:00 AM IST for the previous day. Players then withdraw from their wallet.</small></p>'}
async function pay(d){if(!confirm('Credit '+d+' prizes to the winners\' wallets?'))return;try{await A('settle',{date:d});lb(d)}catch(e){alert(e.message)}}
async function set(){const c=await A('config');V.innerHTML='<h3>Prizes for rank 1-5 (₹)</h3><div class=row>'+c.prizes.map((p,i)=>'<input id=p'+i+' value="'+p+'">').join('')+'</div><h3>Referral commission %</h3><input id=rr value="'+(+(c.refRate*100).toFixed(2))+'"><h3>Minimum withdrawal ₹</h3><input id=mw value="'+c.minWithdraw+'"><br><button onclick="save()">SAVE</button><h3>Block / unblock player (Telegram id)</h3><input id=bu><div class=row><button onclick="ban(true)">BAN</button><button onclick="ban(false)">UNBAN</button></div>'}
async function save(){try{await A('setConfig',{prizes:[0,1,2,3,4].map(i=>$('p'+i).value),refRate:$('rr').value/100,minWithdraw:$('mw').value});alert('Saved')}catch(e){alert(e.message)}}
async function ban(x){try{const r=await A('ban',{uid:$('bu').value,banned:x});alert((x?'Banned: ':'Unbanned: ')+r.name)}catch(e){alert(e.message)}}
tab('wd')
</script></body></html>
